<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>挖礦與建設遊戲</title>
    <style>
        body {
            margin: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            border-radius: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <canvas id="game" width="900" height="550"></canvas>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        /* ===== 遊戲資料 ===== */
        const player = { x: 400, y: 290, width: 40, height: 40, speed: 4, color: "#4caf50" };
        const resources = { stone: 0, wood: 0 };
        let gameOver = false;
        let score = 0;

        // 目標區域 - 用來展示建設區域
        const buildArea = { x: 300, y: 450, width: 200, height: 50 };

        // 挖礦區域
        const mineArea = { x: 100, y: 350, width: 200, height: 50 };

        /* ===== 按鍵輸入 ===== */
        const keys = {};
        window.addEventListener("keydown", e => keys[e.key] = true);
        window.addEventListener("keyup", e => keys[e.key] = false);

        /* ===== 遊戲邏輯 ===== */
        function update() {
            if (gameOver) return;

            // 玩家移動
            if (keys["ArrowLeft"]) player.x -= player.speed;
            if (keys["ArrowRight"]) player.x += player.speed;
            if (keys["ArrowUp"]) player.y -= player.speed;
            if (keys["ArrowDown"]) player.y += player.speed;

            // 控制玩家移動範圍
            player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
            player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));

            // 挖礦
            if (player.x < mineArea.x + mineArea.width && player.x + player.width > mineArea.x &&
                player.y < mineArea.y + mineArea.height && player.y + player.height > mineArea.y) {
                // 挖礦區域內
                if (keys["m"]) {
                    resources.stone += 1;
                    score += 1;
                }
            }

            // 建設
            if (player.x < buildArea.x + buildArea.width && player.x + player.width > buildArea.x &&
                player.y < buildArea.y + buildArea.height && player.y + player.height > buildArea.y) {
                // 建設區域內
                if (keys["b"] && resources.stone >= 3 && resources.wood >= 5) {
                    resources.stone -= 3;
                    resources.wood -= 5;
                    score += 10; // 每次建設成功增加分數
                    console.log("建設成功！");
                }
            }

            // 檢查遊戲結束條件（例如資源不足、時間結束等）
            if (resources.stone >= 10 && resources.wood >= 10) {
                gameOver = true;
            }
        }

        /* ===== UI 工具 ===== */
        function drawPixel(x, y, color, width = 10, height = 10) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, width, height);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 背景
            ctx.fillStyle = "#e3f2fd";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 顯示玩家
            drawPixel(player.x, player.y, player.color);

            // 顯示資源
            ctx.fillStyle = "#000";
            ctx.font = "20px sans-serif";
            ctx.fillText("石頭: " + resources.stone, 10, 30);
            ctx.fillText("木材: " + resources.wood, 10, 60);
            ctx.fillText("分數: " + score, canvas.width - 100, 30);

            // 挖礦區域
            ctx.fillStyle = "#ffeb3b";
            ctx.fillRect(mineArea.x, mineArea.y, mineArea.width, mineArea.height);
            ctx.fillStyle = "#000";
            ctx.fillText("按 'M' 挖礦", mineArea.x + 50, mineArea.y + 30);

            // 建設區域
            ctx.fillStyle = "#8bc34a";
            ctx.fillRect(buildArea.x, buildArea.y, buildArea.width, buildArea.height);
            ctx.fillStyle = "#000";
            ctx.fillText("按 'B' 建設 (3 石頭 + 5 木材)", buildArea.x + 50, buildArea.y + 30);

            // 遊戲結束顯示
            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#fff";
                ctx.font = "40px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("遊戲結束！", canvas.width / 2, canvas.height / 2 - 50);
                ctx.fillText("最終分數: " + score, canvas.width / 2, canvas.height / 2);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();  // 開始遊戲循環
    </script>
</body>
</html>
