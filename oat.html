<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>挖礦與建設遊戲</title>
    <style>
        body {
            margin: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            border-radius: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <canvas id="game" width="900" height="550"></canvas>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        // 玩家資料
        const player = { x: 400, y: 290, width: 20, height: 20, speed: 4, color: "#4caf50" };

        // 資源資料
        let resources = { stone: 0, wood: 0, gems: 0 };
        let score = 0;
        let gameOver = false;
        let dropCount = 0;  // 記錄掉落的次數

        // 掉落物品資料
        const items = [];  // 這裡儲存掉落的物品

        // 按鍵事件
        const keys = {};
        window.addEventListener("keydown", e => keys[e.key] = true);
        window.addEventListener("keyup", e => keys[e.key] = false);

        // 挖礦與掉落機制
        function handleItemDrop() {
            if (keys["ArrowDown"]) {
                dropCount++;
                if (dropCount % 20 === 0) {
                    // 每按 20 次掉落兩個寶石
                    items.push({ x: player.x + 30, y: player.y + 20, color: "#9c27b0", type: "gem" });
                    items.push({ x: player.x + 50, y: player.y + 20, color: "#9c27b0", type: "gem" });
                    resources.gems += 2;
                    console.log("掉落寶石！目前寶石數量：" + resources.gems);
                } else {
                    // 隨機掉落木材或礦石
                    if (Math.random() < 0.5) {
                        items.push({ x: player.x + 30, y: player.y + 20, color: "#ffeb3b", type: "wood" });
                        resources.wood += 1;
                        console.log("掉落木材！目前木材數量：" + resources.wood);
                    } else {
                        items.push({ x: player.x + 30, y: player.y + 20, color: "#ffeb3b", type: "stone" });
                        resources.stone += 1;
                        console.log("掉落礦石！目前礦石數量：" + resources.stone);
                    }
                }
            }
        }

        // 玩家移動邏輯
        function update() {
            if (gameOver) return;

            if (keys["ArrowLeft"]) player.x -= player.speed;
            if (keys["ArrowRight"]) player.x += player.speed;
            if (keys["ArrowUp"]) player.y -= player.speed;
            if (keys["ArrowDown"]) player.y += player.speed;  // 按下下鍵會掉落物品

            // 控制玩家在畫布範圍內移動
            player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
            player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));

            // 處理掉落機制
            handleItemDrop();

            // 更新物品位置
            items.forEach(item => {
                item.y += 2;  // 物品掉落速度
            });

            // 遊戲結束條件
            if (resources.stone >= 10 && resources.wood >= 10) {
                gameOver = true;
            }
        }

        // 繪製遊戲畫面
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 背景設置為像素風格色塊（背景使用綠色調）
            ctx.fillStyle = "#81c784";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 顯示玩家
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // 顯示資源
            ctx.fillStyle = "#000";
            ctx.font = "20px sans-serif";
            ctx.fillText("石頭: " + resources.stone, 10, 30);
            ctx.fillText("木材: " + resources.wood, 10, 60);
            ctx.fillText("寶石: " + resources.gems, 10, 90);
            ctx.fillText("分數: " + score, canvas.width - 100, 30);

            // 顯示掉落物品
            items.forEach(item => {
                ctx.fillStyle = item.color;
                if (item.type === "wood") {
                    ctx.fillRect(item.x, item.y, 10, 20);  // 木材顯示為長方形
                } else if (item.type === "stone") {
                    ctx.beginPath();
                    ctx.moveTo(item.x, item.y);  // 礦石顯示為金黃色的三角形
                    ctx.lineTo(item.x + 10, item.y + 20);
                    ctx.lineTo(item.x - 10, item.y + 20);
                    ctx.closePath();
                    ctx.fill();
                } else if (item.type === "gem") {
                    ctx.beginPath();
                    ctx.moveTo(item.x, item.y);  // 寶石顯示為紫色的正方形
                    ctx.lineTo(item.x + 10, item.y);
                    ctx.lineTo(item.x + 10, item.y + 10);
                    ctx.lineTo(item.x, item.y + 10);
                    ctx.closePath();
                    ctx.fill();
                }
            });

            // 遊戲結束顯示
            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#fff";
                ctx.font = "40px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("遊戲結束！", canvas.width / 2, canvas.height / 2 - 50);
                ctx.fillText("最終分數: " + score, canvas.width / 2, canvas.height / 2);
            }
        }

        // 遊戲循環
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();  // 開始遊戲循環
    </script>
</body>
</html>
