<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Otter River Game</title>
<style>
body {
  margin: 0;
  background: #111;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
canvas {
  border: 2px solid #000;
  background: #2e7d32;
}
</style>
</head>
<body>

<canvas id="game" width="900" height="550"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// 河
const river = {
  y: 260,
  height: 120,
  shrinkSpeed: 10 / 60 // 每秒縮 10px
};

// 海獺
const otter = {
  x: 400,
  y: 290,
  width: 90,
  height: 60,
  speed: 4,
  float: 0
};

let score = 0;
let gameOver = false;

// 紅點 + 黃點（固定）
const points = [
  // 🔴 紅點（5 分）x5
  { x: 150, y: river.y + 20, r: 10, color: "red", value: 5, active: true },
  { x: 300, y: river.y + 40, r: 10, color: "red", value: 5, active: true },
  { x: 450, y: river.y + 60, r: 10, color: "red", value: 5, active: true },
  { x: 600, y: river.y + 80, r: 10, color: "red", value: 5, active: true },
  { x: 750, y: river.y + 30, r: 10, color: "red", value: 5, active: true },

  // 🟡 黃點（2 分）x6
  { x: 200, y: river.y + 70, r: 8, color: "yellow", value: 2, active: true },
  { x: 260, y: river.y + 30, r: 8, color: "yellow", value: 2, active: true },
  { x: 360, y: river.y + 90, r: 8, color: "yellow", value: 2, active: true },
  { x: 520, y: river.y + 20, r: 8, color: "yellow", value: 2, active: true },
  { x: 680, y: river.y + 60, r: 8, color: "yellow", value: 2, active: true },
  { x: 820, y: river.y + 90, r: 8, color: "yellow", value: 2, active: true }
];

const keys = {};
window.addEventListener("keydown", e => keys[e.key] = true);
window.addEventListener("keyup", e => keys[e.key] = false);

function update() {
  if (gameOver) return;

  // 移動
  if (keys["ArrowLeft"]) otter.x -= otter.speed;
  if (keys["ArrowRight"]) otter.x += otter.speed;
  if (keys["ArrowUp"]) otter.y -= otter.speed;
  if (keys["ArrowDown"]) otter.y += otter.speed;

  // 河道縮小（上下同時）
  river.y += river.shrinkSpeed / 2;
  river.height -= river.shrinkSpeed;

  // 限制海獺只能在河裡
  otter.y = Math.max(
    river.y,
    Math.min(river.y + river.height - otter.height, otter.y)
  );

  otter.x = Math.max(0, Math.min(canvas.width - otter.width, otter.x));

  // 吃點數
  points.forEach(p => {
    if (!p.active) return;
    const dx = (otter.x + otter.width / 2) - p.x;
    const dy = (otter.y + otter.height / 2) - p.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < p.r + otter.height / 2) {
      score += p.value;
      p.active = false;
    }
  });

  // 結束條件：河道擠到海獺
  if (river.height <= otter.height) {
    gameOver = true;
  }

  otter.float += 0.05;
}

function draw() {
  // 背景
  ctx.fillStyle = "#4caf50";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 河
  ctx.fillStyle = "rgba(33,150,243,0.5)";
  ctx.fillRect(0, river.y, canvas.width, river.height);

  // 點數
  points.forEach(p => {
    if (!p.active) return;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  });

  // 海獺
  const floatY = Math.sin(otter.float) * 4;
  ctx.fillStyle = "#6d4c41";
  ctx.fillRect(
    otter.x,
    otter.y + floatY,
    otter.width,
    otter.height
  );

  // 分數
  ctx.fillStyle = "#fff";
  ctx.font = "22px sans-serif";
  ctx.textAlign = "right";
  ctx.fillText("Score: " + score, canvas.width - 20, 30);
  ctx.textAlign = "left";

  // 結算畫面
  if (gameOver) {
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#fff";
    ctx.font = "48px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 20);

    ctx.font = "28px sans-serif";
    ctx.fillText(
      "Final Score: " + score,
      canvas.width / 2,
      canvas.height / 2 + 30
    );

    ctx.textAlign = "left";
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
