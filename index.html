<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>可移動的色塊</title>
<style>
body {
  margin: 0;
  background: #111;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
canvas {
  border: 2px solid #000;
  background: #2e7d32;
}
</style>
</head>
<body>

<canvas id="game" width="900" height="550"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// ⚠️ 圖片仍保留，但不影響畫面顯示
const bgImage = new Image();
bgImage.src = "images/jungle.jfif";

const otterImage = new Image();
otterImage.src = "images/otter.jfif";

// 河
const river = { y: 260, height: 120 };

// 海獺
const otter = {
  x: 400,
  y: 290,
  width: 90,
  height: 60,
  speed: 4,
  float: 0
};

// 分數
let score = 0;

// 紅點與黃點（固定不動）
const points = [
  // 紅點（5 分）
  { x: 200, y: river.y + 30, r: 10, color: "red", value: 5, active: true },
  { x: 650, y: river.y + 90, r: 10, color: "red", value: 5, active: true },

  // 黃點（2 分）
  { x: 300, y: river.y + 60, r: 8, color: "yellow", value: 2, active: true },
  { x: 450, y: river.y + 40, r: 8, color: "yellow", value: 2, active: true },
  { x: 550, y: river.y + 80, r: 8, color: "yellow", value: 2, active: true }
];

const keys = {};
window.addEventListener("keydown", e => keys[e.key] = true);
window.addEventListener("keyup", e => keys[e.key] = false);

function update() {
  if (keys["ArrowLeft"]) otter.x -= otter.speed;
  if (keys["ArrowRight"]) otter.x += otter.speed;
  if (keys["ArrowUp"]) otter.y -= otter.speed;
  if (keys["ArrowDown"]) otter.y += otter.speed;

  otter.x = Math.max(0, Math.min(canvas.width - otter.width, otter.x));
  otter.y = Math.max(
    river.y,
    Math.min(river.y + river.height - otter.height, otter.y)
  );

  // 碰撞判斷（吃紅點 / 黃點）
  points.forEach(p => {
    if (!p.active) return;

    const dx = (otter.x + otter.width / 2) - p.x;
    const dy = (otter.y + otter.height / 2) - p.y;
    const distance = Math.sqrt(dx * dx + dy * dy);

    if (distance < p.r + Math.min(otter.width, otter.height) / 2) {
      score += p.value;
      p.active = false;
    }
  });

  otter.float += 0.05;
}

function draw() {
  // 背景（固定顏色，避免整片蓋掉）
  ctx.fillStyle = "#4caf50";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 河
  ctx.fillStyle = "rgba(33,150,243,0.4)";
  ctx.fillRect(0, river.y, canvas.width, river.height);

  // 點數
  points.forEach(p => {
    if (!p.active) return;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  });

  // 海獺（有漂浮效果）
  const floatY = Math.sin(otter.float) * 4;
  if (otterImage.complete && otterImage.naturalWidth !== 0) {
    ctx.drawImage(
      otterImage,
      otter.x,
      otter.y + floatY,
      otter.width,
      otter.height
    );
  } else {
    ctx.fillStyle = "#6d4c41";
    ctx.fillRect(otter.x, otter.y, otter.width, otter.height);
  }

  // 分數顯示（右上角）
  ctx.fillStyle = "#fff";
  ctx.font = "22px sans-serif";
  ctx.textAlign = "right";
  ctx.fillText("Score: " + score, canvas.width - 20, 30);
  ctx.textAlign = "left";
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

bgImage.onerror = () => console.error("❌ 背景圖片載入失敗");
otterImage.onerror = () => console.error("❌ 海獺圖片載入失敗");

loop();
</script>

</body>
</html>
